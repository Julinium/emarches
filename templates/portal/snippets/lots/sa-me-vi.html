{% load i18n %}                    
<div class="col-12">
    <div class="d-flex-inline my-3">
        <div class="text-muted small fw-light">
            <span><i class="bi bi-dash-lg"></i></span>
            <span>{{ caption }}:</span>
        </div>
        <div class="ul">
            {% for object in objects %}
                <div class="li">
                    <span class="fw-bold mt-2">{{ object.when }}: </span>
                    <span class="small">{{ object.description }}</span><br>
                </div>
            {% empty %}
                <div class="li">
                    <span class="fw-light small text-muted my-2">{% trans 'Not found' %}</span>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
