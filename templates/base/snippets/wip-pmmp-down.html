{% load i18n %}

<div class="card shadow shadow-1 bg-warning-subtle mb-4"
     aria-label="{% trans 'Official portal down' %}">
    <div class="container-fluid p-3">
        <div class="d-flex align-items-center gap-3">
            <div class="flex-shrink-0 pt-1 pt-md-0">
                <i class="bi bi-exclamation-diamond text-danger fs-3" aria-hidden="true"></i>
            </div>

            <div class="flex-grow-1 mb-1">
                <strong class="">{% trans "Official portal down" %}.</strong>
                <span class="small"><a href="https://www.marchespublics.gov.ma" target="_blank">marchespublics.gov.ma</a> {% trans "is experiencing down times these days" %}.</span>
                <span class="small">{% trans "Data on our website may not be updated as soon as usual" %}.</span>
            </div>
        </div>
    </div>
</div>
