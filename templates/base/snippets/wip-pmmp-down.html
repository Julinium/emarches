{% load i18n %}

<div class="card shadow shadow-1 bg-warning-subtle mb-4"
     aria-label="{% trans 'Portal troubles' %}">
    <div class="container-fluid p-2">
        <div class="d-flex align-items-top gap-3">
            <div class="flex-shrink-0 pt-1 pt-md-0">
                <i class="bi bi-exclamation-diamond text-danger fs-3" aria-hidden="true"></i>
            </div>
            <div class="flex-grow-1">
                <div>
                    <strong class="">{% trans "Portal troubles" %}.</strong>
                </div>
                <div> 
                    <span class="small">{% trans "The official portal has recently experienced down times" %}.</span>
                    <span class="small">{% trans "Data on our website may not be updated as soon as usual" %}.</span>                   
                </div>
            </div>
        </div>
    </div>
</div>
