{% load i18n %}

<!-- Website testing notice -->
<div class="alert alert-warning rounded-0 border-0 border-bottom border-warning-subtle mb-0 py-2"
     role="status"
     aria-label="{% trans 'Website testing notice' %}">
    <div class="container-fluid px-3 px-md-4" style="max-width: 768px;">
        <div class="d-flex align-items-center gap-3">
            <div class="flex-shrink-0 pt-1 pt-md-0">
                <i class="bi bi-cone-striped text-danger fs-3" aria-hidden="true"></i>
            </div>

            <div class="flex-grow-1 mb-1">
                <strong class="">{% trans "Website under test" %}.</strong>
                <span class="small">{% trans "Some information may be incomplete, inaccurate, or unavailable" %}.</span>
                <span class="small">{% trans "Thank you for your patience and feedback" %}.</span>
            </div>

            <button type="button"
                    class="btn-close flex-shrink-0"
                    data-bs-dismiss="alert"
                    aria-label="{% trans 'Dismiss notice' %}">
            </button>
        </div>
    </div>
</div>
<!-- End website testing notice -->
