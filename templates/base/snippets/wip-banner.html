{% load i18n %}

<!-- Website testing notice -->
<div class="alert alert-warning rounded-0 border-0 border-bottom border-warning-subtle mb-0 py-2"
     role="status"
     aria-label="{% trans 'Website testing notice' %}">
    <div class="container-fluid px-3 px-md-4" style="max-width: 600px;">
        <div class="d-flex align-items-center gap-3">
            <div class="flex-shrink-0 pt-1 pt-md-0">
                <i class="bi bi-cone-striped fs-3" aria-hidden="true"></i>
            </div>

            <div class="flex-grow-1">
                <strong class="d-block mb-1">{% trans "Website under test" %}.</strong>
                <p class="mb-0 small">
                    <span>{% trans "Some information may be incomplete, inaccurate, or unavailable" %}.</span>
                    <span>{% trans "Thank you for your patience and feedback" %}.</span>
                </p>
            </div>

            <button type="button"
                    class="btn-close flex-shrink-0"
                    data-bs-dismiss="alert"
                    aria-label="{% trans 'Dismiss notice' %}">
            </button>
        </div>
    </div>
</div>
<!-- End website testing notice -->
