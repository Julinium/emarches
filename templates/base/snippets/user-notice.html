{% load i18n %}

<!-- Same credentials -->
<div class="alert alert-success rounded-0 border-0 border-bottom border-success-subtle mb-0 py-2"
     role="status"
     aria-label="{% trans 'Same credentials' %}">
    <div class="container-fluid px-3 px-md-4" style="max-width: 768px;">
        <div class="d-flex align-items-center gap-3">
            <div class="flex-shrink-0 pt-1 pt-md-0">
                <i class="bi bi-person-fill-lock fs-3" aria-hidden="true"></i>
            </div>

            <div class="flex-grow-1">
                <strong class="d-block mb-1">{% trans "Same credentials" %}.</strong>
                <p class="mb-0 small">
                    <span>{% trans "If you had an account on the old website, use it to login" %}.</span>
                    <span>{% trans "Feel free to contact us if you have any issues" %}.</span>
                </p>
            </div>

            <button type="button"
                    class="btn-close flex-shrink-0"
                    data-bs-dismiss="alert"
                    aria-label="{% trans 'Dismiss notice' %}">
            </button>
        </div>
    </div>
</div>
<!-- End Same credentials -->
