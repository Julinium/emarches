{% load i18n %}

<div class="repeater">
    {% for client in bidder.clients %}
        <div class="repeater-container">
            <div style="opacity: 0.7;">
                <span>{{ client.name }}</span>
            </div>
            <div class="repeater-emphasis">
                <div class="repeater-subtitle">
                    <span>{% trans 'Biddings' %}:</span>
                    <span class="digital">{{ client.deposits_count }}</span>
                </div>
            </div>
        </div>
    {% empty %}
        <p style="color: var(--text-muted);">--</p>
    {% endfor %}
</div>
